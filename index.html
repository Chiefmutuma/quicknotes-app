<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture your thoughts, one note at a time.</p>
  </header>

  <main>
    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a note</h2>
      <form id="note-form">
        <div class="form-row">
          <label for="note-input">Your note</label>
          <input type="text" id="note-input" placeholder="Type your note here">
        </div>
        <div class="form-row">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" class="error" role="alert"></p>
    </section>

    <section class="card" aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <input type="search" id="search-input" placeholder="Search your notes...">
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026</p>
  </footer>
</body>
</html>
